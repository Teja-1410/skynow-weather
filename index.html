<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SkyNow - search any city and see live weather and a 5-day forecast." />
  <title>SkyNow | Live Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">SkyNow</h1>

    <form class="search" id="search-form" role="search" autocomplete="off">
      <label for="city-input" class="visually-hidden">Search city</label>
      <input id="city-input" type="search" placeholder="Search a city, e.g. Hyderabad" aria-autocomplete="list" aria-controls="suggestions" />
      <button type="submit" class="btn btn-primary">Search</button>
      <button type="button" class="btn" id="locate-btn" title="Use my location">My location</button>
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </form>

    <div class="unit-toggle" role="group" aria-label="Temperature unit">
      <button type="button" class="unit active" data-unit="celsius" aria-pressed="true">°C</button>
      <button type="button" class="unit" data-unit="fahrenheit" aria-pressed="false">°F</button>
    </div>
  </header>

  <main class="container">
    <div id="recent" class="recent" aria-label="Recent searches"></div>
    <section id="weather" class="weather" aria-live="polite">
      <p class="message">Search for a city to see its weather.</p>
    </section>
  </main>

  <footer class="footer">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
